
name: Deploy Node.js App to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest

      - name: Load existing Docker image
        run: |
          docker images
          minikube image load node-k8s-app:v3

      - name: Deploy application to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/node-app --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Verify application version
        run: |
          kubectl describe deployment node-app | grep "Image:"
