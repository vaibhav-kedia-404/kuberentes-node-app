name: Deploy Node.js App to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker images

      - name: Verify V3 image
        run: |
          docker image inspect node-k8s-app:v3

      - name: Load V3 image into Minikube
        run: |
          minikube image load node-k8s-app:v3

      - name: Verify image in Minikube
        run: |
          minikube image ls | grep node-k8s-app

      - name: Deploy application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/node-app

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/node-app --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Verify V3 image
        run: |
          kubectl describe deployment node-app | grep "Image:"

